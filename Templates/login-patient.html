{% extends 'MainTemplate.html' %}

{% block links %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
<link rel="shortcut" href="/static/images/patient1.png">
<link rel="shortcut icon" href="/static/images/patient1.png">
<link rel="stylesheet" href="/static/css/login.css">

<style>
    body {
        background: url('/static/images/mainpic\ 5.09.15\ PM.jpg');
        height: 100vh;
        width: 100%;
        background-repeat: no-repeat;
        -webkit-background-size: cover;
        background-size: fill;
    }
</style>
{% endblock %}

{% block title %} Patient login {% endblock %}

{% block content %}
{% include 'nav.html' %}

<div class='main'>
    {% if error %}
    <script>alert('{{error}}');</script>
    {% endif %}
    <div class="formdiv">
        <form class="form" action="/login-patient/" method="post">
            {% csrf_token %}
            <h1 class="heading">LOGIN</h1>

            <div class="imgedit">
                <img src="/static/images/patient1.png" />
            </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input name="email" type="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <input name="password" type="password" class="form-control" placeholder="Password" required>
            </div>
            <div><button name="submit" type="submit" class="btn btn-success">Log In</button></div>

            <a href="/signup-patient/" class="link">Don't have an account? Register one</a>
        </form>
    </div>
</div>
<div>
</div>
<style>
    .warning {
        background-color: red;
    }
</style>

<style>
    @media (max-width: 576px) {
        .formdiv {
            max-width: 300px;
            margin: 0 auto;
            padding: 15px;
        }

        .form {
            margin-top: 50px;
        }

        .imgedit {
            text-align: center;
            margin-bottom: 20px;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 10px;
        }

        body {
            background-size: cover;
        }
    }
</style>
{% endblock %}
