{% extends 'MainTemplate.html' %}
{% block links %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.min.js" integrity="sha384-IDwe1+LCz02ROU9k972gdyvl+AESN10+x7tBKgc9I5HFtuNz0wWnPclzo6p9vxnk" crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

<style>
  .headingStyling {
    color: #3b3b3b;
  }
    
  .divShadow {
    background-color:rgba(244, 244, 244, 0.868);
    box-shadow: 5px 7px 7px 1px #00000023;
    margin-top: 85px;
  }

  form {
    padding: 15px;
    border-radius: 10px;

  }
  .backimage{
        width: 40px;
        height: 40px;
        position: fixed;
        top: 90%;
        left: 93%;
    }

</style>

{% endblock %}







{% block title %}
Record Edit
{% endblock %}

{% block content %}

{% include 'patient_navbar.html' %}

<div class=" d-flex justify-content-center">
<div class=" w-50 mt-2">

<form method="POST" action="/patient_record_edit/" enctype="multipart/form-data" class="divShadow">
  {% csrf_token %}
  <p class="headingStyling text-center fs-2 fw-semibold font-monospace">Edit Details</p>

    <div class="row g-2">
      <input type="text" name="patient_firstname" class="form-control col-lg me-1  mb-3" placeholder="First Name" value="{{patient_firstname}}" required>
      <input type="text" name="patient_secondname" class="form-control col-lg mb-3" placeholder="Second Name" value="{{patient_secondname}}" required>
    </div>
      <input type="text" name="patient_age" class="form-control mb-3" placeholder="Age" value="{{patient_age}}" required>
      <input type="text" name="patient_dob" class="form-control mb-3" placeholder="Birth Date (yyyy-mm-dd)" value="{{patient_dob}}" required>
      <input type="text" name="patient_gender" class="form-control mb-3" placeholder="Gender" value="{{patient_gender}}" required>
      <input type="text" name="patient_civilstatus" class="form-control mb-3" placeholder="Civil Status" value="{{patient_civilstatus}}" required>
      <input type="text" name="patient_mobile" class="form-control mb-3" placeholder="Mobile Number" value="{{patient_mobile}}" required>
      <p class="mb-3 ms-2">Select Profile Picture</p>
      <input type="file" name="patient_imgfile" class="form-control mb-3" placeholder="Select Profile Image">
      <div class="d-flex justify-content-center">
     
        <button type="submit" name='editsubmit' class="btn w-50 btn-success btn-outline-light btn-primary">Submit</button>

      <div>
      <div>
      </div>
  </form>
</div>
</div>

{% endblock %}
